<div style="font-family: Inter, Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #0f172a;">
  <p style="font-size: 20px; font-weight: 900; letter-spacing: -0.3px; margin: 0 0 16px;">Sentinel</p>
  <h2 style="font-size: 18px; margin: 0 0 12px;">Você foi convidado para o Sentinel</h2>
  <p style="font-size: 14px; line-height: 1.6; margin: 0 0 20px;">Você recebeu acesso à área de gestão do Sentinel da sua empresa. Use o botão abaixo para aceitar o convite e criar sua senha.</p>
  <p style="margin: 0 0 20px;">
    <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=invite"
       style="display: inline-block; background: #1968e6; color: #ffffff; text-decoration: none; font-weight: 700; font-size: 14px; padding: 12px 20px; border-radius: 8px;">Aceitar convite</a>
  </p>
  <p style="font-size: 12px; line-height: 1.6; color: #64748b; margin: 0;">O link só pode ser usado uma vez. Se você não esperava este convite, ignore este e-mail.</p>
</div>
